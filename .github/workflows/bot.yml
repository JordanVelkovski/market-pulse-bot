name: Market Pulse Bot

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Post a round now (ignore the 30-60 min wait)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-pulse-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post one round if it's time (5 posts, 1-2 min apart)
        env:
          PYTHONUNBUFFERED: "1"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python bot.py --once --force
          else
            python bot.py --once
          fi

      - name: Save seen.json and state.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update posted news"
            git pull --rebase
            git push
          fi
